<header class="site-header">
    <div class="header-shell">
        <a routerLink="/" class="brand">
            <img src="/assets/anchor/img/anchor_brand.png" alt="Anchor">
        </a>
        <nav class="nav-links">
            <a routerLink="/" class="nav-link">Home</a>
            <a routerLink="/dashboard" class="nav-link">Dashboard</a>
            <a routerLink="/factura/create" class="nav-link">Registrar</a>
        </nav>
        <div class="header-actions">
            <a *ngIf="!isLoggedIn" type="button" class="ghost-btn" routerLink="/login">Login</a>
            <button *ngIf="isLoggedIn" type="button" class="ghost-btn danger" (click)="logout()">Salir</button>
        </div>
    </div>
</header>
