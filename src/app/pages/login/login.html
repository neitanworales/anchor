<section class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <img src="/assets/img/anchor_logo.png" alt="Anchor Logo">
            <div>
                <p class="eyebrow">Bienvenido</p>
                <h1>Acceso seguro</h1>
                <p>Inicia sesion para continuar con el panel de facturas.</p>
            </div>
        </div>
        <form (ngSubmit)="onSubmit()" novalidate>
            <div class="form-grid">
                <label>
                    Email
                    <input
                        type="email"
                        name="email"
                        [(ngModel)]="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required>
                </label>
                <label>
                    Password
                    <input
                        type="password"
                        name="password"
                        [(ngModel)]="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>
                </label>
            </div>

            <div *ngIf="errorMessage" class="alert alert-error" role="alert">
                {{ errorMessage }}
            </div>

            <div class="actions">
                <label class="checkline">
                    <input type="checkbox" value="remember-me">
                    Recordarme
                </label>
                <button class="primary-btn" type="submit" [disabled]="isLoading">
                    {{ isLoading ? 'Ingresando...' : 'Entrar' }}
                </button>
            </div>
        </form>
        <p class="footer-note">© a . n. c. h. o. r</p>
    </div>
</section>
