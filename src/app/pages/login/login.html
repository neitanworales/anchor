<div class="row">
    <div class="col-sm-9 col-md-7 col-lg-5 mx-auto">
        <div class="card border-0 shadow rounded-3 my-5">
            <main class="card-body form-signin m-auto">
                <form (ngSubmit)="onSubmit()" novalidate>
                    <img class="mb-4" src="/assets/img/anchor_logo.png" alt="" width="100%">
                    <h1 class="h3 mb-3 fw-normal">Please sign in</h1>
                    <div class="form-group form-floating" style="margin-bottom: 1em;"> 
                        <input
                            type="email"
                            class="form-control"
                            id="floatingInput"
                            name="email"
                            [(ngModel)]="email"
                            placeholder="name@example.com"
                            autocomplete="email"
                            required>
                            <label for="floatingInput">Email address</label>
                    </div>
                    <div class="form-group form-floating">
                        <input
                            type="password"
                            class="form-control"
                            id="floatingPassword"
                            name="password"
                            [(ngModel)]="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required>
                            <label for="floatingPassword">Password</label>
                    </div>
                    <div *ngIf="errorMessage" class="alert alert-danger mt-3" role="alert">
                        {{ errorMessage }}
                    </div>
                    <div class="form-check text-start my-3"> <input class="form-check-input" type="checkbox"
                            value="remember-me" id="checkDefault">
                            <label class="form-check-label" for="checkDefault">
                            Remember me
                        </label> </div>
                    <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="isLoading">
                        {{ isLoading ? 'Ingresando...' : 'Sign in' }}
                    </button>
                    <p class="mt-5 mb-3 text-body-secondary">© a . n. c. h. o. r</p>
                </form>
            </main>
        </div>
    </div>
